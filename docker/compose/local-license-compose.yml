# MassDB OSS cluster with a license: 3 masters, 3 volume servers, a filer
# and an S3 gateway, all state on named volumes.
#
# Masters do not form a cluster without a license, so before the first start:
#
#   1. docker compose -f local-license-compose.yml run --rm master0 license.init -mdir=/data
#      prints the license request; note its deployment_id.
#   2. docker compose -f local-license-compose.yml run --rm master1 license.init -mdir=/data -clusterId=<deployment_id>
#      docker compose -f local-license-compose.yml run --rm master2 license.init -mdir=/data -clusterId=<deployment_id>
#   3. Have the request signed and save the certificate as ./license/cert.jws.
#   4. docker compose -f local-license-compose.yml up -d
#
# Renew by importing a new certificate on the leader (POST /license/import);
# -license.file only seeds a master's state when it starts.
# volume4 (profile "extra") checks the volume server quota.

x-image: &image ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:local}

services:
  master0:
    image: *image
    ports:
      - 9333:9333
      - 19333:19333
    command: "-v=1 master -ip=master0 -port=9333 -peers=master0:9333,master1:9334,master2:9335 -mdir=/data -license.file=/license/cert.jws"
    volumes:
      - master0:/data
      - ./license:/license:ro
  master1:
    image: *image
    ports:
      - 9334:9334
      - 19334:19334
    command: "-v=1 master -ip=master1 -port=9334 -peers=master0:9333,master1:9334,master2:9335 -mdir=/data -license.file=/license/cert.jws"
    volumes:
      - master1:/data
      - ./license:/license:ro
  master2:
    image: *image
    ports:
      - 9335:9335
      - 19335:19335
    command: "-v=1 master -ip=master2 -port=9335 -peers=master0:9333,master1:9334,master2:9335 -mdir=/data -license.file=/license/cert.jws"
    volumes:
      - master2:/data
      - ./license:/license:ro
  volume1:
    image: *image
    command: 'volume -mserver="master0:9333,master1:9334,master2:9335" -port=8080 -ip=volume1 -preStopSeconds=1'
    volumes:
      - volume1:/data
    depends_on: [master0, master1, master2]
  volume2:
    image: *image
    command: 'volume -mserver="master0:9333,master1:9334,master2:9335" -port=8080 -ip=volume2 -preStopSeconds=1'
    volumes:
      - volume2:/data
    depends_on: [master0, master1, master2]
  volume3:
    image: *image
    command: 'volume -mserver="master0:9333,master1:9334,master2:9335" -port=8080 -ip=volume3 -preStopSeconds=1'
    volumes:
      - volume3:/data
    depends_on: [master0, master1, master2]
  volume4:
    image: *image
    profiles: [extra]
    command: 'volume -mserver="master0:9333,master1:9334,master2:9335" -port=8080 -ip=volume4 -preStopSeconds=1'
    volumes:
      - volume4:/data
    depends_on: [master0, master1, master2]
  filer:
    image: *image
    ports:
      - 8888:8888
      - 18888:18888
    # The filer store (/etc/seaweedfs/filer.toml) and the license cache
    # (-defaultStoreDir) are both under /data.
    command: 'filer -master="master0:9333,master1:9334,master2:9335" -ip=filer -defaultStoreDir=/data'
    volumes:
      - filer:/data
    depends_on: [volume1, volume2, volume3]
  s3:
    image: *image
    ports:
      - 8333:8333
    command: 's3 -filer="filer:8888" -ip.bind=0.0.0.0'
    depends_on: [filer]

volumes:
  master0:
  master1:
  master2:
  volume1:
  volume2:
  volume3:
  volume4:
  filer:
