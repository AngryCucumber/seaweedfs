# MassDB OSS volume 启动参数（weed volume，技术来源 SeaweedFS）
# 一行一个 key = value，启动脚本转成 -key=value；# 开头的行和空行忽略，值为空的键不传（用 weed 默认值）。
# 值原样传给 weed，不做引号和变量展开；多个值按 weed 的写法用逗号连接。
# logdir、v、config_dir 等全局参数由脚本放到子命令之前。默认值取现场 Ansible 部署。
# 平台部署时由平台改写这里的平台管理键：port port.grpc ip dir mserver dataCenter rack metricsPort logdir

# 本机地址，同时是 volume 的标识；不设时自动探测
# ip = 10.0.0.1
port = 9340
# port.grpc = 19340
metricsPort = 9381
# 全部 master，逗号分隔
mserver = localhost:9333
# dataCenter = dc1
# rack = rack1

# 数据目录，多块盘用逗号分隔（max 对应写多个值），启动前需已存在
dir = /data/massdb-oss-storage/massdb-oss-volume
logdir = /data/massdb-oss-storage/massdb-oss-log/volume

# 现场 Ansible 参数
index = leveldbLarge
max = 0
minFreeSpace = 10GiB
concurrentUploadLimitMB = 0
concurrentDownloadLimitMB = 0

# glog 只写日志文件，不再同时写到标准输出（<logdir>/volume.out 只留启动错误与崩溃信息）
alsologtostderr = false
