# MassDB OSS filer 启动参数（weed filer，技术来源 SeaweedFS）
# 一行一个 key = value，启动脚本转成 -key=value；# 开头的行和空行忽略，值为空的键不传（用 weed 默认值）。
# 值原样传给 weed，不做引号和变量展开；多个值按 weed 的写法用逗号连接。
# logdir、v、config_dir 等全局参数由脚本放到子命令之前。默认值取现场 Ansible 部署。
# 元数据存在 Cassandra，连接参数在同目录的 filer.toml。
# 平台部署时由平台改写这里的平台管理键：port port.grpc ip master defaultStoreDir metricsPort logdir，
# 内嵌 S3 时另有 s3 s3.port s3.config

# 本机地址；不设时自动探测
# ip = 10.0.0.1
port = 9350
# port.grpc = 19350
metricsPort = 9382
# 全部 master，逗号分隔
master = localhost:9333

# 本地目录：授权缓存 license-cache.json 等，启动前需已存在
defaultStoreDir = /data/massdb-oss-storage/massdb-oss-filer
logdir = /data/massdb-oss-storage/massdb-oss-log/filer

# 内嵌 S3（与 s3 角色二选一，同机都启用会端口冲突）。s3.config 是访问密钥文件，
# 由平台渲染，不随包发布；相对路径以 filer 角色目录为起点，文件不存在时 filer 启动失败。
s3 = true
s3.port = 9010
s3.config = conf/s3.json

# 现场 Ansible 参数
concurrentUploadLimitMB = 0
# 大于 0 时小文件正文存进元数据，证书无效时会被隐藏；平台部署固定为 0
saveToFilerLimit = 0

# glog 只写日志文件，不再同时写到标准输出（<logdir>/filer.out 只留启动错误与崩溃信息）
alsologtostderr = false
