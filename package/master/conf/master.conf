# MassDB OSS master 启动参数（weed master，技术来源 SeaweedFS）
# 一行一个 key = value，启动脚本转成 -key=value；# 开头的行和空行忽略，值为空的键不传（用 weed 默认值）。
# 值原样传给 weed，不做引号和变量展开；多个值按 weed 的写法用逗号连接。
# logdir、v、config_dir 等全局参数由脚本放到子命令之前。默认值取现场 Ansible 部署。
# 平台部署时由平台改写这里的平台管理键：port port.grpc ip mdir peers license.file metricsPort logdir

# 本机地址，同时是 master 的标识；不设时自动探测
# ip = 10.0.0.1
port = 9333
# gRPC 端口，不设时为 port + 10000
# port.grpc = 19333
metricsPort = 9380

# 元数据与授权状态目录（<mdir>/license/state.json），必须是持久目录，启动前需已存在
mdir = /data/massdb-oss-storage/massdb-oss-master
logdir = /data/massdb-oss-storage/massdb-oss-log/master
# 多 master（1 或 3 台，奇数）时列出全部 master，逗号分隔；单 master 不设
# peers = 10.0.0.1:9333,10.0.0.2:9333,10.0.0.3:9333
# 首次启动导入的证书文件（先在本机执行 weed license.init -mdir=<mdir>）
# license.file = /data/massdb-oss-storage/massdb-oss-master/license.jws

# 现场 Ansible 参数；defaultReplication 在 3 台及以上 volume 时为 001，单机为 000
volumePreallocate = true
volumeSizeLimitMB = 5000
defaultReplication = 000

# glog 只写日志文件，不再同时写到标准输出（<logdir>/master.out 只留启动错误与崩溃信息）
alsologtostderr = false
