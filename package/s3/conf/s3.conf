# MassDB OSS 独立 S3 启动参数（weed s3，技术来源 SeaweedFS）
# 一行一个 key = value，启动脚本转成 -key=value；# 开头的行和空行忽略，值为空的键不传（用 weed 默认值）。
# 值原样传给 weed，不做引号和变量展开；多个值按 weed 的写法用逗号连接。
# logdir、v、config_dir 等全局参数由脚本放到子命令之前。
# 默认 S3 内嵌在 filer 里（filer.conf 的 s3 = true）；只有单独部署 S3 主机时才用本角色，
# 与内嵌 S3 同机都启用会端口冲突。
# 平台部署时由平台改写这里的平台管理键：port filer config ip.bind metricsPort logdir

port = 9010
# port.grpc = 19010
metricsPort = 9383
# 不设时 weed s3 只监听 localhost
ip.bind = 0.0.0.0
# 要连接的 filer
filer = localhost:9350
# 访问密钥文件，由平台渲染，不随包发布；相对路径以 s3 角色目录为起点，文件不存在时启动失败
config = conf/s3.json
logdir = /data/massdb-oss-storage/massdb-oss-log/s3

# glog 只写日志文件，不再同时写到标准输出（<logdir>/s3.out 只留启动错误与崩溃信息）
alsologtostderr = false
