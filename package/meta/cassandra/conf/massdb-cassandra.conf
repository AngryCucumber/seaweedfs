# MassDB OSS 元数据库（技术来源 Apache Cassandra）启动脚本的设置，一行一个 key = value。
# Cassandra 自身的配置在同目录的 cassandra.yaml 与 jvm17-server.options。

# 日志目录：system.log、debug.log、gc.log 与 cassandra.out（启动输出）
log_dir = /data/massdb-oss-storage/massdb-oss-log/cassandra
# JMX exporter（Prometheus /metrics）端口，0 表示不加载；规则见 jmx-exporter.yaml
jmx_exporter_port = 7070
